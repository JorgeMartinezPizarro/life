# Period-39 glider gun: the first true-period-39 glider gun, completed
# by Caleb R. Hilton on July 25, 2026, built around a p39 dependent
# reflector. Period 39 was the highest unsolved gun period and the
# last remaining multiple of 3 - only seven periods (17, 19, 23, 26,
# 29, 31, 38) are still without a known true-period gun. The original
# was 46x35 cells; over the following two days Entity Valkyrie 2,
# Hilton himself, iNoMed and hotcrystal0 whittled it down to this
# 33x26 form. One of the newest entries in LifeWiki's gun catalogue at
# the time this file was written.
# https://conwaylife.com/wiki/Period-39_glider_gun
# Verified independently (own Python re-implementation of B3/S23, not
# this project's binary): the 33x26 engine region returns to its exact
# starting state every 39 generations while total population grows by
# +5 each time - one fresh glider escaping down-right per period, the
# engine itself never wearing out. Placed near the top-left corner
# (edge=finite) so the diagonal stream has room to fly before it would
# otherwise exit the window.
rule=B3/S23
cell_size=5
speed_ms=40
edge=finite
