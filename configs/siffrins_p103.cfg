# Siffrin's p103: a period-103 oscillator discovered by "siffrin
# normal" on February 21, 2026, posted to the ConwayLife.com forums.
# At a minimum population of 68 cells (it swells up to 260 at its
# busiest point in the cycle, then sheds the excess again) it is over
# 100 cells smaller than the previous record holder for this period.
# It is also the first known engine-based period-103 oscillator, and
# the first to turn up "in the wild" in a random soup search rather
# than being hand-engineered. One of the newest patterns in LifeWiki's
# oscillator catalogue at the time this file was written.
# https://conwaylife.com/wiki/Siffrin%27s_p103
# Verified independently (own Python re-implementation of B3/S23, not
# this project's binary): stepping the pattern below 103 generations
# reproduces the exact starting cell set (true period 103, no drift),
# with population dipping to exactly 68 along the way - matching
# LifeWiki's stated period and minimum population. Its bounding box
# never exceeds the 42x42 cell it's drawn in here, so four
# non-interacting copies are tiled with a 3-cell gap on edge=torus.
rule=B3/S23
cell_size=8
speed_ms=60
edge=torus
