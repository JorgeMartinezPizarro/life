# R-pentomino: the most famous "methuselah". Only 5 cells, but it
# evolves chaotically for 1103 generations before stabilizing
# (verified by simulation): exact final population = 116, staying
# constant from generation 1103 onward.
# Along the way 6 gliders escape diagonally. With edge=finite, one
# of the 6 leaves the board (800x500) right before generation 1103
# and population is lost at the edge (113 instead of 116) - hence
# edge=torus: this way, the 6 gliders wrap around instead of dying
# and the exact classic result is reproduced (verified up to
# generation 2000 without any glider touching the ash again).
# The central "ash" (not counting the gliders) measures about 110x75
# cells, well within the margin of this board.
# https://conwaylife.com/wiki/R-pentomino
