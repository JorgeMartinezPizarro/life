# R-pentomino: el "methuselah" mas famoso. Solo 5 celulas, pero
# evoluciona de forma caotica durante 1103 generaciones antes de
# estabilizarse (verificado por simulacion): poblacion final exacta
# = 116, y se queda constante desde la generacion 1103 en adelante.
# En el camino escapan 6 planeadores en diagonal. Con edge=finite uno
# de los 6 se sale del tablero (800x500) justo antes de la generacion
# 1103 y se pierde poblacion por el borde (113 en vez de 116) - por
# eso edge=torus: asi, los 6 planeadores dan la vuelta en vez de morir
# y se reproduce el resultado clasico exacto (verificado hasta la
# generacion 2000 sin que ningun planeador vuelva a tocar el ash).
# El "ash" central (sin contar los planeadores) mide unas 110x75
# celulas, muy por debajo del margen de este tablero.
# https://conwaylife.com/wiki/R-pentomino
rule=B3/S23
cell_size=1
speed_ms=20
edge=torus
