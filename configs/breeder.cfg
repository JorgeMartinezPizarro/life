# Switch-engine breeder by Mitchell Riley (July 2006), a non-standard
# "Blockish" construction: 75 blocks and 5 beehives placed with
# precision, apparently static, until a single trigger glider sets
# them off in a chain reaction. From there, every collision creates
# a new switch engine which in turn creates more - QUADRATIC growth,
# faster than any cannon or puffer in this repository (which only
# grow linearly). It's the same family as switch_engine.cfg, but at
# true "breeder" scale.
# Verified by simulation: population 335 -> 1743 over 4000
# generations, with increasing increments every 400 generations
# (non-linear). edge=finite: like every methuselah/breeder, it ends
# up overflowing any finite board - it's left to grow.
# https://conwaylife.com/wiki/Switch-engine_breeder
rule=B3/S23
cell_size=2
speed_ms=10
edge=finite
