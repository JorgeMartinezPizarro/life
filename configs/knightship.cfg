# Sir Robin: the first elementary "knightship" found in Conway's
# automaton (Adam P. Goucher and collaborators, April 2018,
# Conway's Game of Life distributed search project). It's a ship
# that moves like a chess knight: every 96 generations it shifts by
# exactly (32,16) cells - a 2:1 ratio, a "knight's move" diagonal
# instead of orthogonal or a 1:1 diagonal. 282 cells, constant
# population every period (verified by simulation). edge=torus:
# one-way trip until it leaves the board.
# https://conwaylife.com/wiki/Sir_Robin
rule=B3/S23
cell_size=3
speed_ms=30
edge=torus
