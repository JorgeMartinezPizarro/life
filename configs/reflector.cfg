# Snark - the smallest known "stable" 90-degree glider reflector
# (stable = built only from still lifes such as blocks and boats,
# quietly waiting until a glider arrives; no moving/oscillating parts
# at rest). Discovered by Mike Playle in 2013 with a search tool he
# wrote called Bellman, as the winning entry of a standing prize for
# this exact reaction. Minimum repeat time is 43 generations, so it
# can reflect a glider stream at any period >= 43.
# This LifeWiki comparison layout shows four independent variants -
# Playle's original plus three by Koenig, Ekstrom and Omick - each
# with its own glider bouncing off its own reflector by 90 degrees.
# Verified by simulation on an unbounded grid: over 1200 generations
# the live-cell bounding box never grows past the pattern drawn below
# - each reflection briefly bumps the population (up to ~240 cells,
# from a baseline of ~212) then settles back down, and nothing ever
# escapes the frame, so a finite grid with a small margin is safe.
rule=B3/S23
cell_size=14
speed_ms=60
edge=finite
