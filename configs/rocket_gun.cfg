# The "Cp200 rocket gun" (David Bell, July 18 1999): a symmetric two-sided
# engine, built for the Day & Night rule, that fires a spaceship every 200
# generations at exactly c/2, orthogonally, while the gun's own cells
# return to their exact starting state every 200 generations too.
# Verified by direct simulation of B3678/S34678: the gun's cells match
# their generation-0 state bit-for-bit again at generation 200 and 400,
# and the rocket's leading edge advances by exactly 25 cells every 50
# generations (c/2) the whole way across the board - confirmed even with
# only a 3-cell margin around the gun, the tight clearance used here.
# edge=finite: the emitted rockets simply fly off the right edge and
# vanish instead of wrapping back into the gun.
# https://entropymine.com/jason/life/alt/guns/b_3__678s___34_678.lif
rule=B3678/S34678
cell_size=6
speed_ms=15
edge=finite
