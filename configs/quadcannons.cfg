# Four Gosper Glider Guns, one per corner, firing diagonally toward
# the center (each one is a 90-degree rotation of the previous).
# Compact variant of the classic quad-cannon: guns pulled closer to
# the center (smaller travel distance) and rendered at 3x the pixel
# scale, while staying within a 960x960 window (well under 1900x1000).
# Note: like the original, the 4 streams don't annihilate perfectly at
# the center - a small amount of debris accumulates every 30
# generations, so this is a very-long-period near-loop, not a true
# infinite exact cycle. It stays clean and bounded for several hundred
# generations, plenty for a live demo; press R to reset if you run it
# for a very long time and want the pristine start again.
rule=B3/S23
cell_size=3
speed_ms=15
edge=finite
