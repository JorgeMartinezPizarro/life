# Sir Robin: la primera "knightship" elemental encontrada en el
# automata de Conway (Adam P. Goucher y colaboradores, abril 2018,
# proyecto de busqueda distribuida de Conway's Game of Life). Es una
# nave que se desplaza como el movimiento del caballo de ajedrez: cada
# 96 generaciones se traslada exactamente (32,16) celulas - proporcion
# 2:1, diagonal "de caballo" en vez de ortogonal u oblicua 1:1. 282
# celulas, poblacion constante cada periodo (verificado por
# simulacion). edge=finite: viaje de ida hasta que sale del tablero.
# https://conwaylife.com/wiki/Sir_Robin
rule=B3/S23
cell_size=3
speed_ms=30
edge=torus
