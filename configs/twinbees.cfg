# Field of Twin Bees Shuttles (verified pattern, Bill Gosper 1971),
# the base oscillator of all known period-46 oscillators. Much
# bigger and more dynamic than the Pulsar: each piece is two 'bees'
# bouncing in phase, alternating orientation in a checkerboard
# pattern, spaced so they never interact with each other.
rule=B3/S23
cell_size=5
speed_ms=60
edge=torus
