# Campo de Twin Bees Shuttle (patron verificado, Bill Gosper 1971),
# el oscilador base de todos los osciladores conocidos de periodo 46.
# Mucho mas grande y dinamico que el Pulsar: cada pieza son dos
# 'abejas' rebotando en fase, alternando orientacion en damero,
# separadas para que nunca interactuen entre si.
rule=B3/S23
cell_size=5
speed_ms=60
edge=torus
