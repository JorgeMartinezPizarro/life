# The p4 photon gun (David Eppstein, June 2000): the fastest gun possible
# in any Life-like rule - it fires a new photon spaceship every single
# period, 4 generations, and each one leaves at the maximum possible
# speed, c, one full cell every generation.
# Verified by direct simulation of B25/S45: the engine (everything except
# its rightmost 3 columns, where the next photon is born) matches its
# generation-0 state exactly every 4 generations, and the emitted stream
# advances by exactly 4 columns every 4 generations - true c, not an
# approximation. Population grows by a steady +4 cells per period, one
# fresh 4-cell photon per shot, forever.
# edge=finite: the photon stream just flies off the right edge and
# vanishes instead of wrapping back into the gun.
# https://entropymine.com/jason/life/alt/guns/b2__5__+s____45+++.lif
rule=B25/S45
cell_size=7
speed_ms=20
edge=finite
