# The HighLife replicator (Nathan Thompson): under the HighLife rule
# (B36/S23, same as Conway's B3/S23 but also born with 6 neighbors),
# this 12-cell figure copies itself diagonally without stopping -
# each copy makes more copies, unbounded cascading growth (verified
# by simulation: the occupied area keeps expanding without stopping).
# Under the normal B3/S23 rule this does NOT happen - birth with
# 6 neighbors is exactly what enables the self-replication.
# https://conwaylife.com/wiki/HighLife
rule=B36/S23
cell_size=3
speed_ms=50
edge=finite
