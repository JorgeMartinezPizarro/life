# Photon, the Seeds rule (B2/S) spaceship. Jason Summers' collection notes
# these are the only period-1 spaceships that exist in this rule - only
# 3 distinct 4-cell shapes, this is the orthogonal one. Hand-verified by
# simulating one full generation (all 8 Moore neighbors of every cell in
# range checked): the only births are the pattern itself shifted by
# (0,-1), with zero leftover debris - by the rule's translation
# invariance that same shift then repeats forever. So this isn't just
# fast, it's the fastest possible: c/1, one full cell every single
# generation, the literal speed limit of the rule (there's no B1, so no
# neighbor pattern can ever produce two independent shifts per step).
# edge=torus: 6 copies spaced 8 cells apart (safely more than the
# 1-cell interaction radius, so they never affect each other) loop
# forever climbing the board.
# https://entropymine.com/jason/life/alt/
rule=B2/S
cell_size=14
speed_ms=40
edge=torus
