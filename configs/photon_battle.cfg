# Photon battle: David Eppstein's p4 photon gun (see photon_gun.cfg) mirrored
# and placed at the opposite end of a 900-wide board, firing head-on at
# each other - both at c, the maximum possible speed. A plain mirror image
# of a verified pattern is itself verified for free: the Moore neighborhood
# B25/S45 is built on is symmetric under reflection, so the mirrored gun
# fires left exactly as cleanly as the original fires right.
# What happens where the two beams meet is NOT a clean annihilation like
# cannons.cfg's gliders - a naive head-on placement (same row) ignites an
# uncontrolled chaotic reaction that eventually consumes the whole board,
# guns included. Searched by simulation (phase and row offset, the same
# technique cannons.cfg used) for a placement where that doesn't happen:
# at a 2-row vertical offset between the guns, the beams interlock into a
# permanent standing-wave interference pattern instead of an explosion.
# Verified by direct simulation of B25/S45 at this exact 900x40 layout:
# the two fronts (822 cells apart) take ~450 generations to meet and
# settle, and from there on the whole board is exactly period-4 -
# confirmed bit-for-bit identical 400 generations apart (gen 500 vs
# gen 900), so it holds forever, not just for a while.
# edge=finite: no wraparound is involved in any of the above.
# https://entropymine.com/jason/life/alt/guns/b2__5__+s____45+++.lif
rule=B25/S45
cell_size=2
speed_ms=5
edge=finite
