# Block-laying switch engine (Charles Corderman): a diagonal
# c/12 puffer of period 288 that leaves behind a permanent trail of
# blocks (still lifes), growing forever in a straight line. It's the
# historical building block of Gosper's "breeders" - the first
# pattern family with demonstrated QUADRATIC growth (faster than any
# cannon, which only grows linearly). Verified by simulation:
# exactly +32 cells every 288 generations, without stopping.
# edge=finite: one-way trip, like sirrobin/puffer/rpentomino.
# https://conwaylife.com/wiki/Block-laying_switch_engine
rule=B3/S23
cell_size=2
speed_ms=15
edge=finite
