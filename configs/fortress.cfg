# Fortaleza compacta de 4 canones: cuatro Gosper Glider Guns en las
# esquinas de un cuadrado interior (heredado de quadcannons.cfg),
# disparando en diagonal hacia el centro. En las cuatro zonas vacias
# entre las lineas de disparo (norte, sur, este, oeste) hay pulsares
# como osciladores de relleno. A izquierda y derecha del cuadrado, en
# cada uno de los 4 carriles por lado (mismo orden espejado que
# antes, misma especie a la misma distancia del cuadrado en ambos
# lados), sube una formacion de 5 naves del "zoo" (spaceship_zoo.cfg)
# en fila, con un cuerpo de separacion entre cada una: Dragon,
# Weekender, Spider y Turtle, cada una la mas rapida conocida de su
# clase de velocidad, girada 90 grados cuando nace mirando al oeste.
# edge=torus: al llegar arriba dan la vuelta y siguen circulando sin
# parar, en vez de salir del tablero.
rule=B3/S23
cell_size=1
speed_ms=10
edge=torus
PATTERN

