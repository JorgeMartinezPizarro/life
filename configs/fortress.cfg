# Compact 4-cannon fortress: four Gosper Glider Guns at the corners
# of an inner square (inherited from quadcannons.cfg), firing
# diagonally toward the center. In the four empty zones between the
# firing lines (north, south, east, west) there are pulsars acting
# as filler oscillators. To the left and right of the square, on
# each of the 4 lanes per side (same mirrored order as before, same
# species at the same distance from the square on both sides), a
# formation of 5 ships from the "zoo" (spaceship_zoo.cfg) travels
# upward in a row, with one body of spacing between each: Dragon,
# Weekender, Spider and Turtle, each the fastest known of its speed
# class, rotated 90 degrees so it's born facing west.
# edge=torus: on reaching the top they wrap around and keep
# circulating without stopping, instead of leaving the board.
rule=B3/S23
cell_size=1
speed_ms=10
edge=torus
PATTERN

