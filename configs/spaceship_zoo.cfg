# Zoo de naves ortogonales compactas: cuatro spaceships "elementales",
# cada una la mas rapida (o mas pequena) conocida de su clase de
# velocidad, viajando hacia arriba en carriles paralelos que nunca se
# tocan (torus, asi que dan la vuelta sin parar). De izquierda a
# derecha:
#   Dragon      (Paul Tooke, 1996)   c/6    - primera nave c/6 construida
#   Weekender   (David Eppstein)     2c/7
#   Spider      (David Bell, 1997)   c/5    - la c/5 mas pequena conocida
#   Turtle      (Dean Hickerson)     c/3
# Dragon y Turtle vienen giradas 90 grados (nacen mirando hacia el
# oeste) para que las 4 viajen en la misma direccion; la regla es
# invariante a rotaciones asi que el giro no cambia su dinamica.
# Verificado por simulacion: poblacion constante y periodo/velocidad
# exactos para las 4 durante 6 periodos completos.
# https://conwaylife.com/wiki/Dragon  /Weekender  /Spider  /Turtle
rule=B3/S23
cell_size=2
speed_ms=60
edge=klein
