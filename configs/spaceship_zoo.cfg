# Zoo of compact orthogonal ships: four "elementary" spaceships,
# each the fastest (or smallest) known of its speed class, traveling
# upward on parallel lanes that never touch (torus, so they wrap
# around without stopping). From left to right:
#   Dragon      (Paul Tooke, 1996)   c/6    - first c/6 ship built
#   Weekender   (David Eppstein)     2c/7
#   Spider      (David Bell, 1997)   c/5    - smallest known c/5
#   Turtle      (Dean Hickerson)     c/3
# Dragon and Turtle are rotated 90 degrees (born facing west) so all
# 4 travel in the same direction; the rule is rotation-invariant so
# the rotation doesn't change their dynamics.
# Verified by simulation: constant population and exact
# period/speed for all 4 across 6 full periods.
# https://conwaylife.com/wiki/Dragon  /Weekender  /Spider  /Turtle
rule=B3/S23
cell_size=2
speed_ms=60
edge=klein
