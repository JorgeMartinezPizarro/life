# The Diamoeba spacefiller (David I. Bell, March 11 1999, based on a
# spaceship by David Eppstein): the first pattern ever proven to grow
# forever in this rule. Diamoeba is famous for chaotic diamond-shaped
# "amoeba" blobs that usually either die out or settle into a static
# shape - this is the exception: instead of stabilizing, its front edge
# keeps pushing outward in every direction at a constant fraction of
# light speed, forever, leaving a textured background behind it rather
# than empty space.
# Verified by direct simulation of B35678/S5678 for 400 generations: the
# bounding box grows steadily and without pause the entire time (from
# 64x8 up to 178x108), and population grows from 336 to 7040 cells -
# no period, no equilibrium, just relentless expansion.
# edge=finite, and the board here (300x180) is deliberately large: with
# the front advancing roughly 1 cell every 3-4 generations per side, it
# takes a good while to reach the edges and fill the whole board.
# https://entropymine.com/jason/life/alt/diamoeba-sf.lif
rule=B35678/S5678
cell_size=3
speed_ms=10
edge=finite
