# Gosper glider gun - a classic Conway pattern that keeps producing
# gliders forever. edge=finite is required here: gliders must be able to
# fly off the board and disappear, otherwise they wrap around, crash back
# into the gun and the whole thing freezes into still lifes.
rule=B3/S23
cell_size=12
speed_ms=80
edge=finite
