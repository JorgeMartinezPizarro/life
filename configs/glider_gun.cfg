# The Simkin glider gun (Michael Simkin, April 28 2015): the first
# genuine period-120 gun found, with only 36 cells in the engine -
# tied with the Gosper gun (36 cells) as the smallest known to date.
# Fires a glider diagonally up-left every 120 generations; the
# engine never self-destructs. Verified by simulation: population
# grows by exactly +5 every 120 generations.
# https://conwaylife.com/wiki/Simkin_glider_gun
rule=B3/S23
cell_size=4
speed_ms=20
edge=finite
