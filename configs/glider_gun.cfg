# El Simkin glider gun (Michael Simkin, 28 abril 2015): el primer canon
# real de periodo 120 encontrado, con solo 36 celulas en el motor - el
# mas pequeno conocido hasta esa fecha junto al Gosper (36 celulas).
# Dispara un planeador en diagonal hacia arriba-izquierda cada 120
# generaciones; el motor nunca se autodestruye. Verificado por
# simulacion: poblacion crece exactamente +5 cada 120 generaciones.
# https://conwaylife.com/wiki/Simkin_glider_gun
rule=B3/S23
cell_size=4
speed_ms=20
edge=finite
