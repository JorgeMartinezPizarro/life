# The (4,1)c/29 knightship (David Eppstein, July 1 2001): a spaceship
# that shifts 4 columns for every 1 row every 29 generations - a slope
# nothing like Sir Robin's (32,16) 2:1 diagonal (knightship.cfg) or a
# plain orthogonal/diagonal mover, closer to an actual chess knight's
# jump geometry (4:1 rather than 2:1).
# Verified by direct simulation of B3/S12567: at generation 29 the whole
# pattern matches generation 0 exactly (population 33 both times, same
# shape) shifted by precisely (4,1) - no residue, no near-misses tried
# at nearby offsets.
# edge=finite: like the other knightship in this collection, a one-way
# trip until it exits the board (placed here bottom-right, since this
# one heads up-left).
# https://entropymine.com/jason/life/alt/kn/knb3s12567a.lif
rule=B3/S12567
cell_size=8
speed_ms=15
edge=torus
