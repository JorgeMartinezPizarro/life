# Tarantula: a c/5 orthogonal spaceship discovered by Frank Everdij on
# January 8, 2025, posted to the ConwayLife.com forums' Spaceship
# Discussion Thread. At 58 cells it ties "spider" for the smallest
# known c/5 orthogonal spaceship (spider has a smaller bounding box,
# so the two remain co-champions by different metrics). One of the
# freshest entries in LifeWiki's spaceship catalogue at the time this
# file was written.
# https://conwaylife.com/wiki/Tarantula
# Verified independently (own Python re-implementation of B3/S23,
# not this project's binary): stepping the pattern below 20
# generations reproduces the exact same 58-cell shape shifted by
# (0,-1) at generations 5, 10, 15 and 20 - i.e. a true period-5,
# speed-c/5 spaceship, matching LifeWiki's stated period and speed.
# It travels "up" (toward decreasing row), so three copies are placed
# on separate columns, staggered vertically, cruising forever on
# edge=torus without ever sharing a column.
rule=B3/S23
cell_size=10
speed_ms=80
edge=torus
