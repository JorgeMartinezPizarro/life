# The p1728 c/98o spaceship gun (Luka Okanishi, June 13 2016): built with a
# 16-glider synthesis around a stream of replicator-based shuttles (base
# period 24), it fires a spaceship every 1728 (=12^3) generations - the
# minimum compression possible for this ship without the copies
# interacting. The ship itself was discovered by Ivan Fomichev in
# February 2015: bilaterally symmetric, only 24 cells in its minimum
# phase, moving at a genuine c/98 orthogonal - deliberately non-monotonic
# (it doesn't creep forward by a constant sub-cell amount each step, its
# 98-generation cycle wobbles instead of gliding smoothly).
# Verified by direct simulation of B36/S23 across the full 1728-generation
# period: comparing the whole canvas at generation 0 against generation
# 1728 turns up exactly 48 differing cells, all inside an 18x12 patch -
# the emitted ship having advanced one period along its lane, everything
# else (the entire engine) back to its exact starting state. The ship
# never leaves the gun's own footprint within one period, so the
# 30-cell margin added here is untouched the whole time.
# edge=finite, cell_size=1: at 583x546 the gun itself is already the
# largest pattern in this collection.
# https://conwaylife.com/forums/viewtopic.php?p=31908#p31908
rule=B36/S23
cell_size=1
speed_ms=10
edge=finite
